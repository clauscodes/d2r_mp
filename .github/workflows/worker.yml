name: worker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Actions -> worker -> Run workflow (e.g. right after adding the secrets)

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADDR_SALT: ${{ secrets.ADDR_SALT }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Not set up yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        working-directory: .
        run: echo "::notice::Deploy skipped - add CLOUDFLARE_API_TOKEN to the repository secrets (README, Deploy)."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm ci
          npx wrangler d1 migrations apply DB --remote
          npx wrangler deploy
          if [ -n "${ADDR_SALT}" ]; then printf '%s' "${ADDR_SALT}" | npx wrangler secret put ADDR_SALT; fi
