# docker compose up -d --build
# Needs ROOMS_DOMAIN in .env (see .env.example); Caddy gets its certificate itself.
services:
  rooms:
    build: ./server
    restart: always
    env_file: .env
    environment:
      ROOMS_TRUST_PROXY: "1"
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - rooms

volumes:
  caddy_data:
  caddy_config:
