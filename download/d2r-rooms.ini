; D2R Rooms relays. A relay carries your game's bytes when friends cannot reach your PC
; (no port forwarding, router without UPnP, carrier-grade NAT). Both PCs dial out to it.
; Guide to running your own: docs/host_a_relay.md in the D2R Rooms repository.

[relay]
; enabled = yes: CREATE GAME lists the room and starts a relay when friends cannot reach you
; enabled = no:  the plugin leaves CREATE GAME to D2RLoader (its own error when your port is closed)
enabled = yes
; auto   = only when D2RLoader reports that your port cannot be reached from outside
; always = every room you host goes through a relay
; never  = never (friends then need your port open)
mode = auto
; use = the relay to host on, by its name below; empty = the first one that answers
use =

[relays]
; One relay per line:  name = wss://address [key]
; The key is only for a private relay; its owner gives it to you.
; When you host, the first relay that answers and takes new rooms is used.
; When you join, the plugin uses the relay the host's room names.
D2R Rooms = wss://d2r-rooms-relay.d2r-rooms.workers.dev
